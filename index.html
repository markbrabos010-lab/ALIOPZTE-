<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIOPZTE Store - متجر التنزيلات والألعاب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-store logo-icon"></i>
                <span class="logo-text">ALIOPZTE <span>Store</span></span>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" onkeyup="searchItems()" placeholder="ابحث عن التطبيقات، الألعاب، السكربتات...">
            </div>

            <button class="btn-admin" onclick="openAdminWithPassword()">
                <i class="fa-solid fa-lock"></i> لوحة التحكم
            </button>
        </div>

        <nav class="categories-bar">
            <button class="cat-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
            <button class="cat-btn" onclick="filterCategory('minecraft', this)"><i class="fa-solid fa-cubes"></i> ماين كرافت</button>
            <button class="cat-btn" onclick="filterCategory('roblox', this)"><i class="fa-solid fa-robot"></i> روبلكس</button>
            <button class="cat-btn" onclick="filterCategory('other-games', this)"><i class="fa-solid fa-gamepad"></i> ألعاب أخرى</button>
            <button class="cat-btn" onclick="filterCategory('videos', this)"><i class="fa-solid fa-circle-play"></i> فيديوهات</button>
        </nav>
    </header>

    <main class="container">
        <div class="section-title">
            <h2 id="currentCategoryTitle">أحدث الإصدارات والمستندات</h2>
        </div>

        <div class="apps-grid" id="appsContainer">
            <!-- يتم تحميل بطاقات التطبيقات والألعاب هنا -->
        </div>
    </main>

    <!-- شباك التفاصيل -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <img id="modalImg" src="" alt="icon">
                <div class="modal-title-info">
                    <h2 id="modalTitle">اسم التطبيق</h2>
                    <p class="developer" id="modalDev">المطور: ALIOPZTE</p>
                    <div class="stats-row">
                        <span><i class="fa-solid fa-star star"></i> <strong id="modalRating">4.8</strong></span>
                        <span><i class="fa-solid fa-download"></i> <strong id="modalDownloads">10k+</strong> تنزيل</span>
                        <span class="verified"><i class="fa-solid fa-shield-halved"></i> آمن وموثوق</span>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <h3>عن هذا التطبيق / الملف</h3>
                <p id="modalDesc">الوصف المفضل...</p>
                
                <div class="download-action">
                    <a id="modalDownloadLink" href="#" target="_blank" class="btn-download-big">
                        <i class="fa-solid fa-download"></i> تنزيل الآن
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allItems = [];
        let currentCategory = 'all';

        // جلب البيانات من ملف data.json على السيرفر
        async function loadOnlineData() {
            try {
                const response = await fetch('data.json');
                allItems = await response.json();
                renderCards();
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
            }
        }

        function renderCards() {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';

            const filteredItems = allItems.filter(item => currentCategory === 'all' || item.category === currentCategory);

            if (filteredItems.length === 0) {
                container.innerHTML = '<div class="no-items">لا تتوفر عناصر في هذا القسم حالياً.</div>';
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openModal(item);

                card.innerHTML = `
                    <div class="card-top">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="card-info">
                            <h3>${item.title}</h3>
                            <span class="app-version">${item.version || 'v1.0'}</span>
                            <div class="card-meta">
                                <span><i class="fa-solid fa-star star"></i> ${item.rating || '4.5'}</span>
                                <span><i class="fa-solid fa-download"></i> ${item.downloads || '1k+'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <span class="badge ${item.category}">${getCategoryName(item.category)}</span>
                        <button class="btn-card-dl"><i class="fa-solid fa-download"></i> تنزيل</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getCategoryName(cat) {
            switch(cat) {
                case 'minecraft': return 'ماين كرافت';
                case 'roblox': return 'روبلكس';
                case 'other-games': return 'ألعاب أخرى';
                case 'videos': return 'فيديو';
                default: return 'عام';
            }
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function searchItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.app-card');
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openModal(item) {
            document.getElementById('modalImg').src = item.image;
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDev').innerText = 'المطور: ' + (item.developer || 'ALIOPZTE');
            document.getElementById('modalRating').innerText = item.rating || '4.5';
            document.getElementById('modalDownloads').innerText = item.downloads || '1k+';
            document.getElementById('modalDesc').innerText = item.desc || 'لا يوجد وصف متاحة لهذا العنصر.';
            document.getElementById('modalDownloadLink').href = item.url;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function openAdminWithPassword() {
            const pass = prompt("أدخل كلمة السر للوصول إلى لوحة التحكم:");
            if (pass === "Aliyaser2012") {
                window.location.href = "admin.html";
            } else if (pass !== null) {
                alert("كلمة السر خاطئة!");
            }
        }

        // تشغيل التحميل عند فتح الصفحة
        loadOnlineData();
    </script>
</body>
</html>
