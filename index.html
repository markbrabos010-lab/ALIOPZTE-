<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIOPZTE Store | عالم الـ RGB والألعاب</title>
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #05070e;
            --card-bg: rgba(13, 18, 30, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes rgbGlowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rgbBorderGlow {
            0% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
            33% { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
            66% { border-color: #7f00ff; box-shadow: 0 0 15px rgba(127, 0, 255, 0.5); }
            100% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
        }

        .rgb-text {
            background: linear-gradient(90deg, #ff007f, #00f2fe, #7f00ff, #00ff88, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbGlowText 4s ease infinite;
        }

        .main-header {
            background: rgba(5, 7, 14, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1000;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1380px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon { font-size: 1.8rem; color: #00f2fe; filter: drop-shadow(0 0 8px #00f2fe); }
        .brand-text { font-size: 1.3rem; font-weight: 900; color: #fff; }

        .visitor-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 12px;
            background: rgba(13, 18, 30, 0.95);
            font-size: 0.85rem;
            font-weight: 800;
            color: #fff;
            animation: rgbBorderGlow 4s infinite linear;
        }

        .visitor-counter-badge i { color: #00f2fe; }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 42px 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(13, 18, 30, 0.9);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .search-box input:focus { outline: none; animation: rgbBorderGlow 3s infinite linear; }
        .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-social {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.82rem;
            text-decoration: none;
            color: #fff;
        }

        .btn-social.youtube { background: rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 0, 0, 0.5); color: #ff4d4d; }
        .btn-social.discord { background: rgba(88, 101, 242, 0.2); border: 1px solid rgba(88, 101, 242, 0.5); color: #7289da; }
        .btn-admin {
            background: linear-gradient(90deg, #ff007f, #7f00ff, #00f2fe);
            color: #fff; border-radius: 10px; padding: 8px 12px;
            font-weight: 900; font-size: 0.82rem; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .container { max-width: 1380px; margin: 0 auto; padding: 20px 15px; }

        /* كارت "عنصر الأسبوع الرائج" */
        .featured-banner {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.15), rgba(0, 242, 254, 0.15));
            border: 2px solid transparent;
            animation: rgbBorderGlow 4s infinite linear;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .featured-badge {
            display: inline-block;
            background: #ff007f;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .featured-title { font-size: 1.4rem; font-weight: 900; color: #fff; }

        .main-layout { display: flex; gap: 20px; align-items: flex-start; }
        .main-content { flex: 1; min-width: 0; }

        .partners-sidebar {
            width: 270px;
            background: rgba(13, 18, 30, 0.88);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 18px;
            padding: 16px;
            backdrop-filter: blur(12px);
        }

        .partners-header {
            display: flex; align-items: center; gap: 10px;
            font-size: 1rem; font-weight: 900; margin-bottom: 14px;
            padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); color: #fff;
        }

        .partners-list { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }

        .partner-card {
            background: rgba(5, 7, 14, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 10px;
            display: flex; align-items: center; gap: 10px;
        }

        .partner-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #00f2fe; }
        .partner-info { flex: 1; overflow: hidden; }
        .partner-name { font-size: 0.88rem; font-weight: 800; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-partner-yt {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 8px; border-radius: 6px; background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5); color: #ff4d4d; font-size: 0.72rem; text-decoration: none;
        }

        .categories-bar {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none;
        }

        .cat-btn {
            background: rgba(13, 18, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted); padding: 8px 16px; border-radius: 12px;
            font-weight: 700; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
        }

        .cat-btn.active {
            background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            color: #fff; border-color: transparent; font-weight: 900;
        }

        .items-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px;
        }

        .item-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
            transition: all 0.3s ease;
        }

        .item-card:hover { transform: translateY(-5px); animation: rgbBorderGlow 3s infinite linear; }

        .card-thumb { width: 100%; height: 175px; position: relative; background: #000; overflow: hidden; }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .item-card:hover .card-thumb img { transform: scale(1.06); }

        .badge-tag {
            position: absolute; top: 10px; right: 10px; padding: 4px 10px;
            border-radius: 8px; font-size: 0.72rem; font-weight: 800; color: #fff; background: rgba(5, 7, 14, 0.85);
        }

        .card-details { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .card-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 14px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .card-meta {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 0.78rem; color: #cbd5e1; margin-bottom: 14px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-card-view {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 10px; background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            color: #fff; border-radius: 10px; font-weight: 900; font-size: 0.9rem; border: none; cursor: pointer;
        }

        /* نافذة العرض Modal وتقييم النجوم */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 2000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #0d121e; border: 2px solid transparent; animation: rgbBorderGlow 3s infinite linear;
            border-radius: 20px; max-width: 600px; width: 100%; max-height: 90vh;
            overflow-y: auto; position: relative; padding: 20px;
        }

        .modal-close {
            position: absolute; top: 14px; left: 14px; background: rgba(255, 255, 255, 0.1);
            border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        }

        .modal-img { width: 100%; max-height: 240px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; }
        .modal-title { font-size: 1.3rem; font-weight: 900; margin-bottom: 10px; color: #fff; }
        .modal-desc { font-size: 0.9rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 16px; background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 10px; }

        /* نظام التقييم بالنجوم */
        .rating-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; padding: 12px; margin-bottom: 16px; text-align: center;
        }

        .stars-container { display: flex; justify-content: center; gap: 8px; font-size: 1.4rem; cursor: pointer; margin-bottom: 8px; }
        .stars-container i { color: #475569; transition: color 0.2s; }
        .stars-container i.selected { color: #f59e0b; }

        .countdown-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px; background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            color: #fff; border-radius: 10px; font-weight: 900; font-size: 1rem; cursor: pointer; border: none;
        }

        @media (max-width: 992px) { .main-layout { flex-direction: column; } .partners-sidebar { width: 100%; } }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="brand">
                <i class="fa-solid fa-gamepad brand-icon"></i>
                <div class="brand-text">ALIOPZTE <span class="rgb-text">STORE</span></div>
            </a>

            <div class="visitor-counter-badge" title="إجمالي زوار المتجر الحقيقي">
                <i class="fa-solid fa-users"></i>
                <span>الزوار: <strong id="visitorCount" class="rgb-text">150</strong></span>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" oninput="filterItems()" placeholder="ابحث عن ألعاب، مودات...">
            </div>

            <div class="header-actions">
                <a href="https://youtube.com/@aliopzte790?si=mW1nU7yXKT5EjYGI" target="_blank" class="btn-social youtube"><i class="fa-brands fa-youtube"></i> القناة</a>
                <a href="https://discord.gg/7BNpX9uZa" target="_blank" class="btn-social discord"><i class="fa-brands fa-discord"></i> ديسكورد</a>
                <a href="admin.html" class="btn-admin"><i class="fa-solid fa-gauge-high"></i> الداشبورد</a>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- كارت "عنصر الأسبوع الرائج" (يتم التحكم به من الداشبورد) -->
        <div class="featured-banner">
            <div>
                <span class="featured-badge"><i class="fa-solid fa-fire"></i> الأفضل والأكثر رواجاً</span>
                <div class="featured-title" id="featuredTitleText">جاري تحميل العنصر الرائج...</div>
                <p id="featuredDescText" style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;"></p>
            </div>
            <button class="btn-card-view" style="width:auto; padding:12px 24px;" onclick="openFeaturedModal()">
                <i class="fa-solid fa-eye"></i> عرض التفاصيل والتحميل
            </button>
        </div>

        <div class="main-layout">
            <main class="main-content">
                <nav class="categories-bar">
                    <button class="cat-btn active" onclick="selectCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
                    <button class="cat-btn" onclick="selectCategory('minecraft', this)"><i class="fa-solid fa-cube"></i> ماين كرافت</button>
                    <button class="cat-btn" onclick="selectCategory('roblox', this)"><i class="fa-solid fa-gamepad"></i> روبلكس</button>
                    <button class="cat-btn" onclick="selectCategory('mods', this)"><i class="fa-solid fa-puzzle-piece"></i> مودات</button>
                    <button class="cat-btn" onclick="selectCategory('scripts', this)"><i class="fa-solid fa-code"></i> سكربتات</button>
                    <button class="cat-btn" onclick="selectCategory('other-games', this)"><i class="fa-solid fa-ghost"></i> ألعاب أخرى</button>
                    <button class="cat-btn" onclick="selectCategory('videos', this)"><i class="fa-solid fa-play"></i> فيديوهات</button>
                </nav>

                <section class="content-section">
                    <div id="itemsGrid" class="items-grid">
                        <p style="text-align:center; width:100%; grid-column: 1/-1; padding:40px; color: var(--text-muted);">جاري تحميل المحتوى...</p>
                    </div>
                </section>
            </main>

            <aside class="partners-sidebar">
                <div class="partners-header"><i class="fa-solid fa-handshake rgb-text"></i><span>روم الشراكات</span></div>
                <div id="partnersGrid" class="partners-list"></div>
            </aside>
        </div>
    </div>

    <!-- النافذة المنبثقة Modal مع نظام تقييم النجوم -->
    <div id="itemModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()"><i class="fa-solid fa-xmark"></i></button>
            <img id="mImg" src="" alt="" class="modal-img">
            <h2 id="mTitle" class="modal-title"></h2>
            <div id="mMeta" style="display:flex; gap:15px; color:#00f2fe; font-weight:bold; font-size:0.85rem; margin-bottom:15px;"></div>
            <p id="mDesc" class="modal-desc"></p>
            
            <!-- نظام التقييم بالنجوم للزوار -->
            <div class="rating-box">
                <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:6px;">قيم هذا العنصر:</p>
                <div class="stars-container" id="starsContainer">
                    <i class="fa-solid fa-star" onclick="rateItem(1)"></i>
                    <i class="fa-solid fa-star" onclick="rateItem(2)"></i>
                    <i class="fa-solid fa-star" onclick="rateItem(3)"></i>
                    <i class="fa-solid fa-star" onclick="rateItem(4)"></i>
                    <i class="fa-solid fa-star" onclick="rateItem(5)"></i>
                </div>
                <span id="ratingMsg" style="font-size:0.75rem; color:#10b981;"></span>
            </div>

            <button id="mDlBtn" onclick="startDownloadTimer()" class="countdown-btn">
                <i class="fa-solid fa-download"></i> تجهيز رابط التحميل
            </button>
        </div>
    </div>

    <script>
        let allItems = [];
        let allPartners = [];
        let currentCategory = 'all';
        let activeTargetUrl = '#';
        let currentModalItem = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadStoreData();
            initCloudCounter();
        });

        async function initCloudCounter() {
            try {
                const res = await fetch('https://api.counterapi.dev/v1/aliopzte_store_global/store_visits/up');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('visitorCount').innerText = data.count || '150';
                }
            } catch (e) {}
        }

        async function loadStoreData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error();
                
                const data = await res.json();
                allItems = data.items || [];
                allPartners = data.partners || [];
                const featuredId = data.featuredId || (allItems[0] ? allItems[0].id : null);

                renderItems(allItems);
                renderPartners(allPartners);
                setupFeaturedBanner(featuredId);
            } catch (err) {
                document.getElementById('itemsGrid').innerHTML = '<p style="text-align:center; color:#ef4444; padding:30px;">تعذر تحميل المنتجات.</p>';
            }
        }

        function setupFeaturedBanner(featuredId) {
            const featuredItem = allItems.find(i => i.id == featuredId) || allItems[0];
            if (featuredItem) {
                document.getElementById('featuredTitleText').innerText = featuredItem.title;
                document.getElementById('featuredDescText').innerText = featuredItem.desc || 'اضغط لمشاهدة التفاصيل وتحميل العنصر الرائج لهذا الأسبوع.';
                window.featuredItemObj = featuredItem;
            }
        }

        function openFeaturedModal() {
            if (window.featuredItemObj) openModal(window.featuredItemObj);
        }

        function renderPartners(partners) {
            const grid = document.getElementById('partnersGrid');
            grid.innerHTML = '';
            partners.forEach(partner => {
                grid.innerHTML += `
                    <div class="partner-card">
                        <img src="${partner.image}" class="partner-avatar">
                        <div class="partner-info">
                            <div class="partner-name">${partner.name}</div>
                            <a href="${partner.youtubeUrl}" target="_blank" class="btn-partner-yt"><i class="fa-brands fa-youtube"></i> يوتيوب</a>
                        </div>
                    </div>`;
            });
        }

        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            const filtered = items.filter(item => {
                const matchesCat = (currentCategory === 'all') || (item.category === currentCategory);
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const matchesSearch = !query || item.title.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 40px; color: var(--text-muted);">لا توجد عناصر.</p>';
                return;
            }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="item-card" onclick='openModal(${JSON.stringify(item)})'>
                        <div class="card-thumb">
                            <img src="${item.image}">
                            <span class="badge-tag">${item.category}</span>
                        </div>
                        <div class="card-details">
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.desc || '...'}</p>
                            <div class="card-meta">
                                <span><i class="fa-solid fa-star" style="color:#f59e0b;"></i> ${item.rating || '4.9'}</span>
                                <span><i class="fa-solid fa-download" style="color:#7f00ff;"></i> ${item.downloads || '1k'}</span>
                            </div>
                            <button class="btn-card-view"><i class="fa-solid fa-eye"></i> التفاصيل والتحميل</button>
                        </div>
                    </div>`;
            });
        }

        function openModal(item) {
            currentModalItem = item;
            activeTargetUrl = item.url;
            document.getElementById('mImg').src = item.image;
            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('mDesc').innerText = item.desc || 'لا يوجد وصف.';
            document.getElementById('mDlBtn').innerHTML = `<i class="fa-solid fa-download"></i> اضغط لتجهيز الرابط الآمن`;
            document.getElementById('mDlBtn').disabled = false;
            resetStars();
            document.getElementById('itemModal').classList.add('active');
        }

        function rateItem(stars) {
            const starElements = document.querySelectorAll('#starsContainer i');
            starElements.forEach((el, index) => {
                if (index < stars) el.classList.add('selected');
                else el.classList.remove('selected');
            });
            document.getElementById('ratingMsg').innerText = `شكراً لتقييمك! (${stars}/5 نجوم)`;
        }

        function resetStars() {
            document.querySelectorAll('#starsContainer i').forEach(el => el.classList.remove('selected'));
            document.getElementById('ratingMsg').innerText = '';
        }

        function startDownloadTimer() {
            const btn = document.getElementById('mDlBtn');
            btn.disabled = true;
            let seconds = 5;
            const timer = setInterval(() => {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> تجهيز الرابط خلال ${seconds} ثوانٍ...`;
                seconds--;
                if (seconds < 0) {
                    clearInterval(timer);
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> جاهز للتحميل الان!`;
                    btn.disabled = false;
                    btn.onclick = () => { window.open(activeTargetUrl, '_blank'); };
                }
            }, 1000);
        }

        function closeModal(e) { if (e.target.id === 'itemModal') document.getElementById('itemModal').classList.remove('active'); }
        function closeModalDirect() { document.getElementById('itemModal').classList.remove('active'); }
        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderItems(allItems);
        }
        function filterItems() { renderItems(allItems); }
    </script>
</body>
