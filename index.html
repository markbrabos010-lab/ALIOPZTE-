<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIOPZTE Store | عالم الـ RGB والألعاب</title>
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- مكتبة العداد المباشر للسيرفر السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.umd.js"></script>
    
    <style>
        :root {
            --bg-dark: #05070e;
            --card-bg: rgba(13, 18, 30, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* تأثيرات ألوان الـ RGB المتحركة */
        @keyframes rgbGlowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rgbBorderGlow {
            0% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
            33% { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
            66% { border-color: #7f00ff; box-shadow: 0 0 15px rgba(127, 0, 255, 0.5); }
            100% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
        }

        .rgb-text {
            background: linear-gradient(90deg, #ff007f, #00f2fe, #7f00ff, #00ff88, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbGlowText 4s ease infinite;
        }

        /* الهيدر العلوي المحسن */
        .main-header {
            background: rgba(5, 7, 14, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1000;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1380px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon {
            font-size: 1.8rem;
            color: #00f2fe;
            filter: drop-shadow(0 0 8px #00f2fe);
        }

        .brand-text {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
        }

        .visitor-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 12px;
            background: rgba(13, 18, 30, 0.95);
            border: 1px solid transparent;
            font-size: 0.85rem;
            font-weight: 800;
            color: #fff;
            animation: rgbBorderGlow 4s infinite linear;
        }

        .visitor-counter-badge i { color: #00f2fe; }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 42px 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(13, 18, 30, 0.9);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            animation: rgbBorderGlow 3s infinite linear;
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-social {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.82rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
        }

        .btn-social.youtube {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff4d4d;
        }

        .btn-social.youtube:hover {
            background: #ff0000;
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
        }

        .btn-social.discord {
            background: rgba(88, 101, 242, 0.2);
            border: 1px solid rgba(88, 101, 242, 0.5);
            color: #7289da;
        }

        .btn-social.discord:hover {
            background: #5865F2;
            color: #fff;
            box-shadow: 0 0 18px rgba(88, 101, 242, 0.6);
        }

        .btn-admin {
            background: linear-gradient(90deg, #ff007f, #7f00ff, #00f2fe);
            background-size: 200% 200%;
            animation: rgbGlowText 4s ease infinite;
            color: #fff;
            border-radius: 10px;
            padding: 8px 12px;
            font-weight: 900;
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(127, 0, 255, 0.4);
        }

        .btn-sound {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #00f2fe;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .container {
            max-width: 1380px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        /* كارت "عنصر الأسبوع المميز" */
        .featured-banner {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.15), rgba(0, 242, 254, 0.15));
            border: 2px solid transparent;
            animation: rgbBorderGlow 4s infinite linear;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .featured-badge {
            display: inline-block;
            background: #ff007f;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .featured-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
        }

        /* شريط الوسوم السريعة */
        .tag-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tag-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .tag-btn.active {
            background: var(--card-bg);
            border-color: #00f2fe;
            color: #00f2fe;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .main-content {
            flex: 1;
            min-width: 0;
        }

        /* شريط الشراكات الجانبي */
        .partners-sidebar {
            width: 270px;
            background: rgba(13, 18, 30, 0.88);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 18px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .partners-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 900;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .partners-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 70vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .partner-card {
            background: rgba(5, 7, 14, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .partner-card:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .partner-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00f2fe;
        }

        .partner-info {
            flex: 1;
            overflow: hidden;
        }

        .partner-name {
            font-size: 0.88rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-partner-yt {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff4d4d;
            font-size: 0.72rem;
            font-weight: 700;
            text-decoration: none;
        }

        /* شريط التصنيفات RGB */
        .categories-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: rgba(13, 18, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .cat-btn:hover { color: #fff; border-color: #00f2fe; }

        .cat-btn.active {
            background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            background-size: 200% 200%;
            animation: rgbGlowText 3s ease infinite;
            color: #fff;
            border-color: transparent;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* كروت العرض RGB */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-5px);
            animation: rgbBorderGlow 3s infinite linear;
        }

        .card-thumb {
            width: 100%;
            height: 175px;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .item-card:hover .card-thumb img { transform: scale(1.06); }

        .badge-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            color: #fff;
            background: rgba(5, 7, 14, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-details {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #cbd5e1;
            margin-bottom: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-card-view {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            background-size: 200% 200%;
            animation: rgbGlowText 4s ease infinite;
            color: #fff;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        /* Modal النافذة المنبثقة للوصف والتحميل الآمن */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #0d121e;
            border: 2px solid transparent;
            animation: rgbBorderGlow 3s infinite linear;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 20px;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: #fff;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 16px;
            white-space: pre-line;
            background: rgba(0, 0, 0, 0.4);
            padding: 14px;
            border-radius: 12px;
            border-right: 4px solid #00f2fe;
        }

        .countdown-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            background-size: 200% 200%;
            animation
