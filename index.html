<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIOPZTE Store | المتجر الرسمي</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة الأيقونات المحدثة والمباشرة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* تحسين الهيدر وأزرار التواصل */
        .main-header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-channel {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.3s ease;
            color: #fff;
        }

        .btn-channel.youtube {
            background: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .btn-channel.discord {
            background: #5865F2;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.3);
        }

        .btn-admin {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.88rem;
            text-decoration: none;
            background: #0284c7;
            color: #fff;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.3);
        }

        /* كروت الألعاب والمحتوى */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .item-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .card-thumb {
            width: 100%;
            height: 180px;
            position: relative;
            background: #000;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        .card-details {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 0 0 15px 0;
            flex: 1;
            line-height: 1.4;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-card-dl {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #fff;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
            border: none;
            box-sizing: border-box;
        }

        .btn-card-dl:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .reviews-section {
            margin-top: 40px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
        }

        .review-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
        }

        .review-form input, .review-form textarea, .review-form select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="theme-neon">

    <header class="main-header">
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-store logo-icon" style="color: #38bdf8; font-size: 1.4rem;"></i>
                <span class="logo-text" style="font-size: 1.2rem; font-weight: bold;">ALIOPZTE <span style="color: #38bdf8;">Store</span></span>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" oninput="filterItems()" placeholder="ابحث عن التطبيقات، الألعاب، المودات..." style="padding: 8px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff;">
            </div>

            <div class="header-actions">
                <a href="https://youtube.com/@aliopzte790?si=mW1nU7yXKT5EjYGI" target="_blank" class="btn-channel youtube"><i class="fa-brands fa-youtube"></i> القناة</a>
                <a href="https://discord.gg/7BNpX9uZa" target="_blank" class="btn-channel discord"><i class="fa-brands fa-discord"></i> الديسكورد</a>
                <a href="admin.html" class="btn-admin"><i class="fa-solid fa-gauge-high"></i> الداشبورد</a>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 1200px; margin: 20px auto; padding: 0 15px;">
        <!-- شريط التصنيفات -->
        <nav class="categories-bar" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px;">
            <button class="cat-btn active" onclick="selectCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
            <button class="cat-btn" onclick="selectCategory('minecraft', this)"><i class="fa-solid fa-cube"></i> ماين كرافت</button>
            <button class="cat-btn" onclick="selectCategory('roblox', this)"><i class="fa-solid fa-gamepad"></i> روبلكس</button>
            <button class="cat-btn" onclick="selectCategory('mods', this)"><i class="fa-solid fa-puzzle-piece"></i> مودات</button>
            <button class="cat-btn" onclick="selectCategory('scripts', this)"><i class="fa-solid fa-code"></i> سكربتات</button>
            <button class="cat-btn" onclick="selectCategory('other-games', this)"><i class="fa-solid fa-ghost"></i> ألعاب أخرى</button>
            <button class="cat-btn" onclick="selectCategory('videos', this)"><i class="fa-solid fa-play"></i> فيديوهات</button>
        </nav>

        <!-- قسم المنتجات والمحتوى -->
        <section class="content-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-fire" style="color: #f97316;"></i> أحدث الإصدارات والمحتوى</h2>
            </div>
            <div id="itemsGrid" class="items-grid">
                <p style="text-align:center; width:100%; grid-column: 1/-1; padding:20px;">جاري تحميل المحتوى...</p>
            </div>
        </section>

        <!-- قسم التقييمات والطلبات -->
        <section class="reviews-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-comments" style="color: #38bdf8;"></i> آراء وتقييمات الزوار (المتحقق منها)</h2>
            </div>

            <!-- نموذج إضافة تقييم أو طلب -->
            <form class="review-form" onsubmit="submitUserReview(event)">
                <h3 style="margin: 0 0 10px 0; font-size: 1rem; color: #38bdf8;"><i class="fa-solid fa-pen"></i> أضف تقييمك أو طلبك</h3>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="text" id="reviewAuthor" placeholder="اسمك (اختياري)" style="flex: 1; min-width: 150px;">
                    <select id="reviewType" style="width: auto; min-width: 120px;">
                        <option value="review">تقييم للمتجر</option>
                        <option value="request">طلب لعبة / مود</option>
                    </select>
                </div>
                <textarea id="reviewText" required placeholder="اكتب تقييمك أو طلبك هنا..."></textarea>
                <button type="submit" style="background: #0284c7; color: #fff; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fa-solid fa-paper-plane"></i> أرسل التقييم / الطلب
                </button>
            </form>

            <!-- قائمة التقييمات المنشورة -->
            <div id="reviewsList">
                <p style="color: #94a3b8;">لا توجد تقييمات منشورة للعلن حالياً.</p>
            </div>
        </section>
    </div>

    <script>
        let allItems = [];
        let currentCategory = 'all';

        document.addEventListener("DOMContentLoaded", () => {
            loadStoreData();
        });

        async function loadStoreData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error("تعذر جلب ملف البيانات");
                
                const data = await res.json();
                
                let itemsList = [];
                let reviewsList = [];

                if (Array.isArray(data)) {
                    itemsList = data;
                } else {
                    itemsList = data.items || [];
                    reviewsList = data.reviews || [];
                    
                    if (data.customBg && typeof data.customBg === 'string' && data.customBg.startsWith('http')) {
                        document.body.style.backgroundImage = `url('${data.customBg}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundAttachment = 'fixed';
                    } else {
                        document.body.style.backgroundImage = 'none';
                    }
                }

                allItems = itemsList;
                renderItems(allItems);
                renderReviews(reviewsList);
            } catch (err) {
                console.error("خطأ في تحميل البيانات:", err);
                document.getElementById('itemsGrid').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#ef4444;">تعذر تحميل المنتجات، يرجى إعادة المحاولة لاحقاً.</p>';
            }
        }

        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            const filtered = items.filter(item => {
                const matchesCat = (currentCategory === 'all') || (item.category === currentCategory);
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const matchesSearch = !query || 
                    (item.title && item.title.toLowerCase().includes(query)) ||
                    (item.desc && item.desc.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 30px; color: #94a3b8;">لا تتوفر عناصر في هذا القسم حالياً.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="${item.image || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png'}" alt="${item.title}">
                        <span class="badge">${getCategoryLabel(item.category)}</span>
                    </div>
                    <div class="card-details">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc || ''}</p>
                        <div class="card-meta">
                            <span><i class="fa-solid fa-code-branch"></i> ${item.version || 'v1.0'}</span>
                            <span><i class="fa-solid fa-star" style="color:#f59e0b;"></i> ${item.rating || '4.9'}</span>
                            <span><i class="fa-solid fa-download"></i> ${item.downloads || '1k'}</span>
                        </div>
                        <a href="${item.url}" target="_blank" class="btn-card-dl"><i class="fa-solid fa-download"></i> تنزيل</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderReviews(reviews) {
            const listDiv = document.getElementById('reviewsList');
            listDiv.innerHTML = '';

            const approvedReviews = reviews.filter(r => r.status === 'approved');

            if (approvedReviews.length === 0) {
                listDiv.innerHTML = '<p style="color: #94a3b8;">لا توجد تقييمات منشورة للعلن حالياً.</p>';
                return;
            }

            approvedReviews.forEach(rev => {
                const card = document.createElement('div');
                card.style.background = 'rgba(255, 255, 255, 0.03)';
                card.style.border = '1px solid rgba(255, 255, 255, 0.08)';
                card.style.borderRadius = '12px';
                card.style.padding = '15px';
                card.style.marginBottom = '12px';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span style="font-weight:bold; color:#38bdf8;"><i class="fa-solid fa-user-circle"></i> ${rev.author || 'زائر'}</span>
                        <span style="font-size:0.75rem; padding:2px 8px; border-radius:6px; background:rgba(56,189,248,0.15); color:#38bdf8;">${rev.type === 'request' ? 'طلب' : 'تقييم'}</span>
                    </div>
                    <p style="margin:5px 0; font-size:0.95rem; color:#fff;">${rev.text}</p>
                    ${rev.reply ? `<div style="margin-top:10px; padding:10px; background:rgba(56,189,248,0.08); border-right:3px solid #38bdf8; border-radius:6px; font-size:0.88rem;"><strong><i class="fa-solid fa-reply"></i> رد الإدارة:</strong> ${rev.reply}</div>` : ''}
                `;
                listDiv.appendChild(card);
            });
        }

        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderItems(allItems);
        }

        function filterItems() {
            renderItems(allItems);
        }

        function getCategoryLabel(cat) {
            const labels = {
                'minecraft': 'ماين كرافت',
                'roblox': 'روبلكس',
                'mods': 'مودات',
                'scripts': 'سكربتات',
                'other-games': 'ألعاب أخرى',
                'videos': 'فيديو'
            };
            return labels[cat] || cat;
        }

        async function submitUserReview(event) {
            event.preventDefault();
            
            const authorInput = document.getElementById("reviewAuthor");
            const textInput = document.getElementById("reviewText");
            const typeInput = document.getElementById("reviewType") || { value: "review" };

            const author = authorInput ? authorInput.value.trim() : "زائر";
            const text = textInput ? textInput.value.trim() : "";

            if (!text) {
                alert("يرجى كتابة نص التقييم أو الطلب أولاً!");
                return;
            }

            const submitBtn = event.target.querySelector("button[type='submit']") || event.target;
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الإرسال...";

            const part1 = "Ghp_Chf2TXrDrkpCjLMo";
            const part2 = "T25AP8v0ZgYpay0DY55t";
            const PUBLIC_TOKEN = part1 + part2;

            const GITHUB_USERNAME = "markbrabos010-lab";
            const REPO_NAME = "ALIOPZTE-";
            const FILE_PATH = "data.json";

            try {
                const getUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
                const res = await fetch(getUrl, {
                    headers: { 'Authorization': `token ${PUBLIC_TOKEN}` }
                });

                if (!res.ok) throw new Error("تعذر الوصول لسيرفر التقييمات حالياً.");

                const fileInfo = await res.json();
                const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const decodedText = new TextDecoder('utf-8').decode(bytes);
                const onlineData = JSON.parse(decodedText);

                let itemsList = Array.isArray(onlineData) ? onlineData : (onlineData.items || []);
                let reviewsList = onlineData.reviews || [];
                let customBg = onlineData.customBg || "";

                const newReview = {
                    id: Date.now(),
                    author: author || "زائر",
                    type: typeInput.value || "review",
                    text: text,
                    status: "pending",
                    reply: ""
                };

                reviewsList.push(newReview);

                const fullPayload = {
                    customBg: customBg,
                    items: itemsList,
                    reviews: reviewsList
                };

                const utf8Bytes = new TextEncoder().encode(JSON.stringify(fullPayload, null, 2));
                let binary = '';
                utf8Bytes.forEach(b => binary += String.fromCharCode(b));
                const updatedContent = btoa(binary);

                const putRes = await fetch(getUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${PUBLIC_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "إضافة تقييم/طلب جديد من زائر",
                        content: updatedContent,
                        sha: fileInfo.sha
                    })
                });

                if (putRes.ok) {
                    alert("تم إرسال تقييمك بنجاح! سيتم مراجعته ونشره في المتجر قريباً.");
                    if (authorInput) authorInput.value = "";
                    if (textInput) textInput.value = "";
                } else {
                    throw new Error("لم يتم حفظ التقييم، يرجى المحاولة لاحقاً.");
                }
            } catch (err) {
                alert("حدث خطأ أثناء الإرسال: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "أرسل التقييم / الطلب";
            }
        }
    </script>
</body>
</html>
