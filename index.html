<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIOPZTE Store - متجر الألعاب والمودات والسكربتات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-neon" id="siteBody">

    <header class="main-header">
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-store logo-icon"></i>
                <span class="logo-text">ALIOPZTE <span>Store</span></span>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" onkeyup="searchItems()" placeholder="ابحث عن التطبيقات، الألعاب، المودات، السكربتات...">
            </div>

            <!-- زر قناة اليوتيوب -->
            <a href="https://youtube.com/@aliopzte790?si=fzxVv4LC0LnWvcJu" target="_blank" class="btn-youtube">
                <i class="fa-brands fa-youtube"></i> القناة
            </a>

            <!-- زر ديسكورد الدعم والطلبات -->
            <a href="https://discord.gg/VvyXGFQjz" target="_blank" class="btn-discord">
                <i class="fa-brands fa-discord"></i> الدعم والطلبات
            </a>

            <!-- أداة تغيير الشكل للزائر -->
            <div class="theme-quick-picker">
                <button onclick="changeTheme('theme-neon')" title="نيون أزرق" class="dot-btn neon-dot"></button>
                <button onclick="changeTheme('theme-cyber')" title="سايبر بنك" class="dot-btn cyber-dot"></button>
                <button onclick="changeTheme('theme-emerald')" title="زمردي" class="dot-btn emerald-dot"></button>
                <button onclick="changeTheme('theme-purple')" title="أرجواني" class="dot-btn purple-dot"></button>
            </div>

            <button class="btn-admin" onclick="openAdminWithPassword()">
                <i class="fa-solid fa-gauge-high"></i> الداشبورد
            </button>
        </div>

        <!-- شريط الأقسام (زر "الكل" على اليسار) -->
        <nav class="categories-bar">
            <button class="cat-btn" onclick="filterCategory('minecraft', this)"><i class="fa-solid fa-cubes"></i> ماين كرافت</button>
            <button class="cat-btn" onclick="filterCategory('roblox', this)"><i class="fa-solid fa-robot"></i> روبلكس</button>
            <button class="cat-btn" onclick="filterCategory('mods', this)"><i class="fa-solid fa-puzzle-piece"></i> مودات</button>
            <button class="cat-btn" onclick="filterCategory('scripts', this)"><i class="fa-solid fa-code"></i> سكربتات</button>
            <button class="cat-btn" onclick="filterCategory('other-games', this)"><i class="fa-solid fa-gamepad"></i> ألعاب أخرى</button>
            <button class="cat-btn" onclick="filterCategory('videos', this)"><i class="fa-solid fa-circle-play"></i> فيديوهات</button>
            <button class="cat-btn cat-all-left active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
        </nav>
    </header>

    <main class="container">
        <div class="section-title">
            <h2 id="currentCategoryTitle"><i class="fa-solid fa-fire-flame-curved"></i> أحدث الإصدارات والمحتوى</h2>
            <span class="refresh-indicator" id="refreshTimer"><i class="fa-solid fa-arrows-rotate fa-spin"></i> تحديث تلقائي فعال</span>
        </div>

        <div class="apps-grid" id="appsContainer">
            <!-- يتم تحميل عناصر المتجر هنا -->
        </div>

        <!-- قسم التقييمات والطلبات العامة المعتمدة -->
        <section class="reviews-section" style="margin-top: 50px;">
            <div class="section-title">
                <h2><i class="fa-solid fa-comments"></i> آراء وتقييمات الزوار (المتحقق منها)</h2>
                <button class="btn-card-dl" onclick="toggleReviewForm()"><i class="fa-solid fa-pen"></i> أضف تقييمك أو طلبك</button>
            </div>

            <!-- نموذج إضافة تقييم -->
            <div id="reviewFormContainer" class="admin-card" style="display: none; margin-bottom: 20px;">
                <h3>أرسل تقييمك أو طلبك للموقع</h3>
                <form onsubmit="submitUserReview(event)" style="margin-top: 10px;">
                    <div class="form-group">
                        <label>الاسم أو اللقب:</label>
                        <input type="text" id="revAuthor" required placeholder="مثال: علي">
                    </div>
                    <div class="form-group">
                        <label>نوع الرسالة:</label>
                        <select id="revType">
                            <option value="review">تقييم للموقع</option>
                            <option value="request">طلب لعبة / مود / سكربت</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الرسالة / التقييم:</label>
                        <textarea id="revText" rows="3" required placeholder="اكتب تقييمك أو طلبك هنا..."></textarea>
                    </div>
                    <button type="submit" id="sendRevBtn" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> إرسال للمراجعة</button>
                </form>
            </div>

            <div class="reviews-grid" id="publicReviewsContainer">
                <p>جاري تحميل التقييمات للعلن...</p>
            </div>
        </section>
    </main>

    <!-- نافذة تفاصيل الملف -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <img id="modalImg" src="" alt="icon">
                <div class="modal-title-info">
                    <h2 id="modalTitle">اسم الملف</h2>
                    <p class="developer" id="modalDev">المطور: ALIOPZTE Studio</p>
                    <div class="stats-row">
                        <span><i class="fa-solid fa-star star"></i> <strong id="modalRating">4.9</strong></span>
                        <span><i class="fa-solid fa-download"></i> <strong id="modalDownloads">10k+</strong> تنزيل</span>
                        <span class="verified"><i class="fa-solid fa-shield-halved"></i> آمن وموثوق</span>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <h3>الشرح والتفاصيل</h3>
                <p id="modalDesc">الوصف...</p>
                
                <div class="download-action">
                    <a id="modalDownloadLink" href="#" target="_blank" class="btn-download-big">
                        <i class="fa-solid fa-cloud-arrow-down"></i> تنزيل / فتح الرابط
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = "markbrabos010-lab";
        const REPO_NAME = "ALIOPZTE-";
        const FILE_PATH = "data.json";

        let allItems = [];
        let allReviews = [];
        let globalBg = "";
        let currentCategory = 'all';

        function applySavedTheme() {
            const savedTheme = localStorage.getItem('aliopzte_theme') || 'theme-neon';
            document.body.className = savedTheme;
        }

        function changeTheme(themeName) {
            document.body.className = themeName;
            localStorage.setItem('aliopzte_theme', themeName);
        }

        async function loadOnlineData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("تعذر تحميل data.json");
                
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    allItems = data;
                    allReviews = [];
                } else {
                    allItems = data.items || [];
                    allReviews = data.reviews || [];
                    globalBg = data.customBg || "";
                    if (globalBg) {
                        document.body.style.backgroundImage = `url('${globalBg}')`;
                        document.body.style.backgroundSize = "cover";
                        document.body.style.backgroundAttachment = "fixed";
                    }
                }
                renderCards();
                renderPublicReviews();
            } catch (error) {
                console.error("خطأ في تحميل البيانات:", error);
            }
        }

        function renderCards() {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';

            const filteredItems = allItems.filter(item => currentCategory === 'all' || item.category === currentCategory);

            if (filteredItems.length === 0) {
                container.innerHTML = '<div class="no-items"><i class="fa-solid fa-box-open"></i> لا تتوفر عناصر في هذا القسم حالياً.</div>';
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openModal(item);

                card.innerHTML = `
                    <div class="card-top">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="card-info">
                            <h3>${item.title}</h3>
                            <span class="app-version">${item.version || 'v1.0'}</span>
                            <div class="card-meta">
                                <span><i class="fa-solid fa-star star"></i> ${item.rating || '4.9'}</span>
                                <span><i class="fa-solid fa-download"></i> ${item.downloads || '1k+'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-bottom">
                        <span class="badge ${item.category}">${getCategoryName(item.category)}</span>
                        <button class="btn-card-dl"><i class="fa-solid fa-download"></i> تنزيل</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderPublicReviews() {
            const container = document.getElementById('publicReviewsContainer');
            container.innerHTML = '';

            const approvedReviews = allReviews.filter(r => r.status === 'approved');

            if (approvedReviews.length === 0) {
                container.innerHTML = '<p class="no-items">لا توجد تقييمات منشورة للعلن حالياً.</p>';
                return;
            }

            approvedReviews.forEach(rev => {
                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <div class="review-header">
                        <strong><i class="fa-solid fa-user-circle"></i> ${rev.author}</strong>
                        <span class="review-type-tag ${rev.type}">${rev.type === 'request' ? 'طلب' : 'تقييم'}</span>
                    </div>
                    <p class="review-body">${rev.text}</p>
                    ${rev.reply ? `<div class="admin-reply"><i class="fa-solid fa-reply"></i> <strong>رد ALIOPZTE:</strong> ${rev.reply}</div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function toggleReviewForm() {
            const form = document.getElementById('reviewFormContainer');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function submitUserReview(e) {
            e.preventDefault();
            const btn = document.getElementById('sendRevBtn');
            btn.disabled = true;
            btn.innerText = "جاري إرسال التقييم...";

            const newRev = {
                id: Date.now(),
                author: document.getElementById('revAuthor').value,
                type: document.getElementById('revType').value,
                text: document.getElementById('revText').value,
                status: 'pending',
                reply: ''
            };

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`);
                const fileInfo = await response.json();

                const binaryString = atob(fileInfo.content.replace(/\s/g, ''));
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const decodedText = new TextDecoder('utf-8').decode(bytes);
                const decodedData = JSON.parse(decodedText);

                let currentItems = Array.isArray(decodedData) ? decodedData : (decodedData.items || []);
                let currentRevs = decodedData.reviews || [];
                let customBg = decodedData.customBg || "";

                currentRevs.unshift(newRev);

                const fullPayload = { customBg, items: currentItems, reviews: currentRevs };
                const utf8Bytes = new TextEncoder().encode(JSON.stringify(fullPayload, null, 2));
                let binary = '';
                utf8Bytes.forEach(b => binary += String.fromCharCode(b));
                const updatedContent = btoa(binary);

                const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "إضافة تقييم جديد",
                        content: updatedContent,
                        sha: fileInfo.sha
                    })
                });

                if (putRes.ok) {
                    alert("تم إرسال تقييمك بنجاح وسيطهر للجميع فور الموافقة عليه!");
                    document.getElementById('revAuthor').value = '';
                    document.getElementById('revText').value = '';
                    toggleReviewForm();
                }
            } catch (err) {
                alert("حدث خطأ في الإرسال: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال للمراجعة';
            }
        }

        function getCategoryName(cat) {
            switch(cat) {
                case 'minecraft': return 'ماين كرافت';
                case 'roblox': return 'روبلكس';
                case 'mods': return 'مودات';
                case 'scripts': return 'سكربتات';
                case 'other-games': return 'ألعاب أخرى';
                case 'videos': return 'فيديو';
                default: return 'عام';
            }
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function searchItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.app-card');
            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'flex' : 'none';
            });
        }

        function openModal(item) {
            document.getElementById('modalImg').src = item.image;
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDev').innerText = 'المطور: ' + (item.developer || 'ALIOPZTE');
            document.getElementById('modalRating').innerText = item.rating || '4.9';
            document.getElementById('modalDownloads').innerText = item.downloads || '1k+';
            document.getElementById('modalDesc').innerText = item.desc || 'لا يوجد وصف متاح.';
            document.getElementById('modalDownloadLink').href = item.url;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function openAdminWithPassword() {
            const pass = prompt("أدخل كلمة السر للوصول للداشبورد:");
            if (pass === "Aliyaser2012") {
                window.location.href = "admin.html";
            } else if (pass !== null) {
                alert("كلمة السر خاطئة!");
            }
        }

        applySavedTheme();
        loadOnlineData();
    </script>
</body>
</html>
