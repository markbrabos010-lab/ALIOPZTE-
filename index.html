<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIOPZTE Store | عالم الـ RGB والألعاب</title>
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- مكتبة العداد المباشر للسيرفر السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.umd.js"></script>
    
    <style>
        :root {
            --bg-dark: #05070e;
            --card-bg: rgba(13, 18, 30, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* تأثيرات ألوان الـ RGB المتحركة */
        @keyframes rgbGlowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rgbBorderGlow {
            0% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
            33% { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
            66% { border-color: #7f00ff; box-shadow: 0 0 15px rgba(127, 0, 255, 0.5); }
            100% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
        }

        .rgb-text {
            background: linear-gradient(90deg, #ff007f, #00f2fe, #7f00ff, #00ff88, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgbGlowText 4s ease infinite;
        }

        /* الهيدر العلوي */
        .main-header {
            background: rgba(5, 7, 14, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 20px;
        }

        .header-container {
            max-width: 1380px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon {
            font-size: 1.8rem;
            color: #00f2fe;
            filter: drop-shadow(0 0 8px #00f2fe);
        }

        .brand-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
        }

        .visitor-counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(13, 18, 30, 0.95);
            border: 1px solid transparent;
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
            animation: rgbBorderGlow 4s infinite linear;
        }

        .visitor-counter-badge i { color: #00f2fe; }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 42px 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(13, 18, 30, 0.9);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            animation: rgbBorderGlow 3s infinite linear;
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-social {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
        }

        .btn-social.youtube {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff4d4d;
        }

        .btn-social.youtube:hover {
            background: #ff0000;
            color: #fff;
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.6);
        }

        .btn-social.discord {
            background: rgba(88, 101, 242, 0.2);
            border: 1px solid rgba(88, 101, 242, 0.5);
            color: #7289da;
        }

        .btn-social.discord:hover {
            background: #5865F2;
            color: #fff;
            box-shadow: 0 0 18px rgba(88, 101, 242, 0.6);
        }

        .btn-admin {
            background: linear-gradient(90deg, #ff007f, #7f00ff, #00f2fe);
            background-size: 200% 200%;
            animation: rgbGlowText 4s ease infinite;
            color: #fff;
            border-radius: 10px;
            padding: 9px 16px;
            font-weight: 900;
            font-size: 0.88rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(127, 0, 255, 0.4);
        }

        .container {
            max-width: 1380px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* تقسيم الواجهة: المحتوى الرئيسي يميناً والشراكات يساراً */
        .main-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .main-content {
            flex: 1;
            min-width: 0;
        }

        /* شريط الشراكات الجانبي (على اليسار) */
        .partners-sidebar {
            width: 290px;
            background: rgba(13, 18, 30, 0.88);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 18px;
            padding: 18px;
            position: sticky;
            top: 90px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .partners-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 900;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .partners-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 75vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .partner-card {
            background: rgba(5, 7, 14, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .partner-card:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            transform: translateY(-3px);
        }

        .partner-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .partner-info {
            flex: 1;
            overflow: hidden;
        }

        .partner-name {
            font-size: 0.95rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-partner-yt {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 8px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff4d4d;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .btn-partner-yt:hover {
            background: #ff0000;
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
        }

        /* شريط التصنيفات RGB */
        .categories-bar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: rgba(13, 18, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .cat-btn:hover { color: #fff; border-color: #00f2fe; }

        .cat-btn.active {
            background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            background-size: 200% 200%;
            animation: rgbGlowText 3s ease infinite;
            color: #fff;
            border-color: transparent;
            font-weight: 900;
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.4);
        }

        /* كروت العرض RGB */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 22px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.35s ease;
        }

        .item-card:hover {
            transform: translateY(-8px);
            animation: rgbBorderGlow 3s infinite linear;
        }

        .card-thumb {
            width: 100%;
            height: 180px;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .item-card:hover .card-thumb img { transform: scale(1.08); }

        .badge-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #fff;
            background: rgba(5, 7, 14, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-details {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-card-view {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            background-size: 200% 200%;
            animation: rgbGlowText 4s ease infinite;
            color: #fff;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #0d121e;
            border: 2px solid transparent;
            animation: rgbBorderGlow 3s infinite linear;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 24px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: #fff;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-radius: 12px;
            border-right: 4px solid #00f2fe;
        }

        .modal-dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00f2fe, #7f00ff, #ff007f);
            background-size: 200% 200%;
            animation: rgbGlowText 3s ease infinite;
            color: #fff;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.1rem;
            text-decoration: none;
        }

        @media (max-width: 992px) {
            .main-layout { flex-direction: column; }
            .partners-sidebar { width: 100%; position: static; }
        }

        @media (max-width: 768px) {
            .header-container { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="brand">
                <i class="fa-solid fa-gamepad brand-icon"></i>
                <div class="brand-text">ALIOPZTE <span class="rgb-text">STORE</span></div>
            </a>

            <!-- عداد الزوار السحابي -->
            <div class="visitor-counter-badge" title="إجمالي زوار المتجر الحقيقي">
                <i class="fa-solid fa-users"></i>
                <span>الزوار: <strong id="visitorCount" class="rgb-text">جاري التحميل...</strong></span>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" oninput="filterItems()" placeholder="ابحث عن ألعاب، مودات، سكربتات...">
            </div>

            <div class="header-actions">
                <a href="https://youtube.com/@aliopzte790?si=mW1nU7yXKT5EjYGI" target="_blank" class="btn-social youtube">
                    <i class="fa-brands fa-youtube"></i> القناة
                </a>
                <a href="https://discord.gg/7BNpX9uZa" target="_blank" class="btn-social discord">
                    <i class="fa-brands fa-discord"></i> الديسكورد
                </a>
                <a href="admin.html" class="btn-admin">
                    <i class="fa-solid fa-gauge-high"></i> الداشبورد
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            
            <!-- المحتوى الرئيسي (التصنيفات والمنتجات) -->
            <main class="main-content">
                <!-- شريط التصنيفات -->
                <nav class="categories-bar">
                    <button class="cat-btn active" onclick="selectCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
                    <button class="cat-btn" onclick="selectCategory('minecraft', this)"><i class="fa-solid fa-cube"></i> ماين كرافت</button>
                    <button class="cat-btn" onclick="selectCategory('roblox', this)"><i class="fa-solid fa-gamepad"></i> روبلكس</button>
                    <button class="cat-btn" onclick="selectCategory('mods', this)"><i class="fa-solid fa-puzzle-piece"></i> مودات</button>
                    <button class="cat-btn" onclick="selectCategory('scripts', this)"><i class="fa-solid fa-code"></i> سكربتات</button>
                    <button class="cat-btn" onclick="selectCategory('other-games', this)"><i class="fa-solid fa-ghost"></i> ألعاب أخرى</button>
                    <button class="cat-btn" onclick="selectCategory('videos', this)"><i class="fa-solid fa-play"></i> فيديوهات</button>
                </nav>

                <!-- قسم المحتوى -->
                <section class="content-section">
                    <div id="itemsGrid" class="items-grid">
                        <p style="text-align:center; width:100%; grid-column: 1/-1; padding:40px; color: var(--text-muted);">جاري تحميل المحتوى من السيرفر...</p>
                    </div>
                </section>
            </main>

            <!-- شريط الشراكات الجانبي على اليسار -->
            <aside class="partners-sidebar">
                <div class="partners-header">
                    <i class="fa-solid fa-handshake rgb-text"></i>
                    <span>روم الشراكات</span>
                </div>
                <div id="partnersGrid" class="partners-list">
                    <p style="text-align:center; color: var(--text-muted); font-size:0.85rem; padding: 15px;">جاري تحميل الشركاء...</p>
                </div>
            </aside>

        </div>
    </div>

    <!-- النافذة المنبثقة للوصف والتفاصيل Modal -->
    <div id="itemModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()"><i class="fa-solid fa-xmark"></i></button>
            <img id="mImg" src="" alt="" class="modal-img">
            <h2 id="mTitle" class="modal-title"></h2>
            <div id="mMeta" style="display:flex; gap:15px; color:#00f2fe; font-weight:bold; font-size:0.85rem; margin-bottom:15px;"></div>
            <p id="mDesc" class="modal-desc"></p>
            <a id="mDlBtn" href="" target="_blank" class="modal-dl-btn"><i class="fa-solid fa-download"></i> تنزيل / مشاهدة الآن</a>
        </div>
    </div>

    <script>
        let allItems = [];
        let allPartners = [];
        let currentCategory = 'all';

        document.addEventListener("DOMContentLoaded", () => {
            loadStoreData();
            initCloudCounter();
        });

        async function initCloudCounter() {
            const countElem = document.getElementById('visitorCount');
            try {
                if (typeof Counter !== 'undefined') {
                    const counter = new Counter({ workspace: 'aliopzte_store_global' });
                    const res = await counter.up('store_visits');
                    if (res && res.value) {
                        countElem.innerText = res.value;
                        return;
                    }
                }
            } catch (err) {}

            try {
                const res = await fetch('https://api.counterapi.dev/v1/aliopzte_store_global/store_visits/up');
                if (res.ok) {
                    const data = await res.json();
                    countElem.innerText = data.count || '150';
                } else {
                    countElem.innerText = '150';
                }
            } catch (e) {
                countElem.innerText = '150';
            }
        }

        async function loadStoreData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error("تعذر جلب ملف البيانات");
                
                const data = await res.json();
                if (Array.isArray(data)) {
                    allItems = data;
                    allPartners = [];
                } else {
                    allItems = data.items || [];
                    allPartners = data.partners || [];
                }

                renderItems(allItems);
                renderPartners(allPartners);
            } catch (err) {
                console.error("خطأ في تحميل البيانات:", err);
                document.getElementById('itemsGrid').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#ef4444; padding:30px;">تعذر تحميل المنتجات، يرجى المحاولة لاحقاً.</p>';
            }
        }

        function renderPartners(partners) {
            const grid = document.getElementById('partnersGrid');
            grid.innerHTML = '';

            if (!partners || partners.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color: var(--text-muted); font-size:0.85rem; padding: 15px;">لا يوجد شركاء حالياً.</p>';
                return;
            }

            partners.forEach(partner => {
                const card = document.createElement('div');
                card.className = 'partner-card';
                card.innerHTML = `
                    <img src="${partner.image || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png'}" alt="${partner.name}" class="partner-avatar">
                    <div class="partner-info">
                        <div class="partner-name">${partner.name}</div>
                        ${partner.youtubeUrl ? `
                            <a href="${partner.youtubeUrl}" target="_blank" class="btn-partner-yt">
                                <i class="fa-brands fa-youtube"></i> يوتيوب
                            </a>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            const filtered = items.filter(item => {
                const matchesCat = (currentCategory === 'all') || (item.category === currentCategory);
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const matchesSearch = !query || 
                    (item.title && item.title.toLowerCase().includes(query)) ||
                    (item.desc && item.desc.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 40px; color: var(--text-muted);">لا تتوفر عناصر في هذا القسم حالياً.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => openModal(item);

                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="${item.image || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png'}" alt="${item.title}">
                        <span class="badge-tag">${getCategoryLabel(item.category)}</span>
                    </div>
                    <div class="card-details">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc || 'اضغط لمشاهدة التفاصيل والوصف...'}</p>
                        <div class="card-meta">
                            <span><i class="fa-solid fa-code-branch" style="color:#00f2fe;"></i> ${item.version || 'v1.0'}</span>
                            <span><i class="fa-solid fa-star" style="color:#f59e0b;"></i> ${item.rating || '4.9'}</span>
                            <span><i class="fa-solid fa-download" style="color:#7f00ff;"></i> ${item.downloads || '1k'}</span>
                        </div>
                        <button class="btn-card-view">
                            <i class="fa-solid fa-eye"></i> عرض التفاصيل والتحميل
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(item) {
            document.getElementById('mImg').src = item.image || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png';
            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('mDesc').innerText = item.desc && item.desc.trim() !== '' ? item.desc : 'لا يوجد وصف إضافي لهذا العنصر.';
            document.getElementById('mDlBtn').href = item.url;
            document.getElementById('mMeta').innerHTML = `
                <span><i class="fa-solid fa-tag"></i> ${getCategoryLabel(item.category)}</span>
                <span><i class="fa-solid fa-code-branch"></i> ${item.version || 'v1.0'}</span>
                <span><i class="fa-solid fa-user"></i> ${item.developer || 'ALIOPZTE'}</span>
            `;
            document.getElementById('itemModal').classList.add('active');
        }

        function closeModal(e) {
            if (e.target.id === 'itemModal') {
                document.getElementById('itemModal').classList.remove('active');
            }
        }

        function closeModalDirect() {
            document.getElementById('itemModal').classList.remove('active');
        }

        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderItems(allItems);
        }

        function filterItems() {
            renderItems(allItems);
        }

        function getCategoryLabel(cat) {
            const labels = {
                'minecraft': 'ماين كرافت',
                'roblox': 'روبلكس',
                'mods': 'مودات',
                'scripts': 'سكربتات',
                'other-games': 'ألعاب أخرى',
                'videos': 'فيديو'
            };
            return labels[cat] || cat;
        }
    </script>
</body>
</html>
