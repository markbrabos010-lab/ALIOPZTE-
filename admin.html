<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم التلقائية - ALIOPZTE Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

    <script>
        if (sessionStorage.getItem('aliopzte_auth') !== 'true') {
            const pass = prompt("من فضلك أدخل كلمة السر للدخول للوحة التحكم:");
            if (pass === "Aliyaser2012") {
                sessionStorage.setItem('aliopzte_auth', 'true');
            } else {
                alert("كلمة السر خاطئة!");
                window.location.href = "index.html";
            }
        }
    </script>

    <header class="main-header">
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-sliders logo-icon"></i>
                <span class="logo-text">لوحة التحكم التلقائية | <span>ALIOPZTE</span></span>
            </div>
            <a href="index.html" class="btn-admin"><i class="fa-solid fa-store"></i> العودة للمتجر</a>
        </div>
    </header>

    <main class="container admin-grid">
        <section class="admin-card">
            <h2><i class="fa-solid fa-plus-circle"></i> إضافة منشور جديد مع رفع صورة ملف</h2>
            
            <div class="form-group" style="background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                <label style="color: #38bdf8;"><i class="fa-solid fa-key"></i> مفتاح GitHub Token (يُحفظ في جهازك):</label>
                <input type="password" id="ghToken" placeholder="ضع مفتاح GitHub Token الخاص بك هنا">
                <button type="button" onclick="saveToken()" class="btn-card-dl" style="margin-top: 5px;">حفظ المفتاح</button>
            </div>

            <form id="addForm" onsubmit="autoSaveToGithub(event)">
                <div class="form-group">
                    <label>عنوان المنشور / اللعبة:</label>
                    <input type="text" id="title" required placeholder="مثال: Minecraft Bedrock Edition">
                </div>

                <div class="form-group">
                    <label>القسم:</label>
                    <select id="category" required>
                        <option value="minecraft">ماين كرافت</option>
                        <option value="roblox">روبلكس</option>
                        <option value="other-games">ألعاب أخرى</option>
                        <option value="videos">فيديوهات</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>رقم الإصدار:</label>
                        <input type="text" id="version" placeholder="v1.2.0">
                    </div>
                    <div class="form-group">
                        <label>اسم المطور:</label>
                        <input type="text" id="developer" placeholder="ALIOPZTE">
                    </div>
                </div>

                <div class="form-group">
                    <label>رابط التحميل المباشر / الفيديو:</label>
                    <input type="url" id="url" required placeholder="https://download-link.com">
                </div>

                <!-- اختيار صورة كملف من الجهاز -->
                <div class="form-group">
                    <label><i class="fa-solid fa-image"></i> اختر صورة الغلاف (ملف من جهازك):</label>
                    <input type="file" id="imageFile" accept="image/*" required onchange="handleImageUpload(event)">
                    <input type="hidden" id="imageBase64">
                    <div id="imagePreviewContainer" style="margin-top: 10px; display: none;">
                        <img id="imagePreview" src="" alt="معاينة الصورة" style="max-width: 120px; max-height: 120px; border-radius: 10px; border: 1px solid #334155;">
                    </div>
                </div>

                <div class="form-group">
                    <label>الوصف:</label>
                    <textarea id="desc" rows="3" placeholder="اكتب شرحاً وتفاصيل كاملة..."></textarea>
                </div>

                <button type="submit" id="saveBtn" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> نشر أوتوماتيكي بالصورة</button>
            </form>
        </section>
    </main>

    <script>
        const GITHUB_USERNAME = "markbrabos010-lab";
        const REPO_NAME = "ALIOPZTE-";
        const FILE_PATH = "data.json";

        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem("github_token");
            if (savedToken) {
                document.getElementById("ghToken").value = savedToken;
            }
        });

        function saveToken() {
            const token = document.getElementById("ghToken").value.trim();
            if (token) {
                localStorage.setItem("github_token", token);
                alert("تم حفظ مفتاح الربط بنجاح!");
            } else {
                alert("يرجى إدخال مفتاح الـ Token أولاً!");
            }
        }

        // قراءة الملف وتحويله لـ Base64
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64String = evt.target.result;
                    document.getElementById('imageBase64').value = base64String;
                    document.getElementById('imagePreview').src = base64String;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function autoSaveToGithub(e) {
            e.preventDefault();

            const token = localStorage.getItem("github_token") || document.getElementById("ghToken").value.trim();
            if (!token) {
                alert("يرجى وضع مفتاح GitHub Token والضغط على (حفظ المفتاح) أولاً لتفعيل النشر التلقائي!");
                return;
            }

            const imgData = document.getElementById('imageBase64').value;
            if (!imgData) {
                alert("يرجى اختيار صورة ملف أولاً!");
                return;
            }

            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.innerText = "جاري جلب الملفات وتحويل الصورة إلى سيرفر GitHub...";

            try {
                const getUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
                const getRes = await fetch(getUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });

                let currentData = [];
                let sha = "";

                if (getRes.ok) {
                    const fileInfo = await getRes.json();
                    sha = fileInfo.sha;
                    const decodedData = decodeURIComponent(escape(atob(fileInfo.content)));
                    currentData = JSON.parse(decodedData);
                }

                const newItem = {
                    id: Date.now(),
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    version: document.getElementById('version').value || 'v1.0',
                    developer: document.getElementById('developer').value || 'ALIOPZTE',
                    rating: "4.8",
                    downloads: "1 k",
                    url: document.getElementById('url').value,
                    image: imgData, // الصورة كملف مخزنة
                    desc: document.getElementById('desc').value
                };

                currentData.unshift(newItem);

                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2))));

                const putRes = await fetch(getUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `نشر جديد مع صورة ملف: ${newItem.title}`,
                        content: updatedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert("تم النشر بنجاح مع رفع صورة الملف مباشرة!");
                    document.getElementById('addForm').reset();
                    document.getElementById('imageBase64').value = '';
                    document.getElementById('imagePreviewContainer').style.display = 'none';
                } else {
                    const err = await putRes.json();
                    alert("حدث خطأ أثناء التحديث: " + (err.message || "تأكد من صحة الـ Token"));
                }

            } catch (err) {
                alert("فشل الاتصال: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> نشر أوتوماتيكي بالصورة';
            }
        }
    </script>
</body>
</html>
