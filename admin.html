<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد ALIOPZTE | إدارة المتجر والشراكات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(15, 23, 42, 0.9);
            --accent-cyan: #00f2fe;
            --accent-purple: #7f00ff;
            --accent-pink: #ff007f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .header h1 { font-size: 1.5rem; color: var(--accent-cyan); }
        .btn-back {
            color: #fff; text-decoration: none; background: rgba(255,255,255,0.1);
            padding: 8px 16px; border-radius: 10px; font-weight: bold;
        }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; color: #cbd5e1; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(5, 7, 14, 0.8); color: #fff;
            font-family: inherit; font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--accent-cyan); }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            background: rgba(255, 255, 255, 0.05); color: #888;
            font-family: inherit; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .btn-submit {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
            color: #fff; font-weight: 900; font-size: 1.1rem; cursor: pointer;
            margin-top: 10px;
        }

        .list-section { margin-top: 30px; }
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 10px;
            margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-del {
            background: #ff4d4d; color: #fff; border: none;
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header">
            <h1><i class="fa-solid fa-gauge-high"></i> لوحة التحكم في المتجر والشراكات</h1>
            <a href="index.html" class="btn-back"><i class="fa-solid fa-store"></i> العودة للمتجر</a>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-key"></i> توكن GitHub (GitHub Token)</label>
            <input type="password" id="ghToken" placeholder="الصق التوكن الخاص بك هنا لتمكين التعديل...">
        </div>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('itemsTab', this)"><i class="fa-solid fa-box"></i> إدارة المنتجات والفيديوهات</button>
            <button class="tab-btn" onclick="switchTab('partnersTab', this)"><i class="fa-solid fa-handshake"></i> إدارة الشراكات</button>
        </div>

        <!-- تبويب المنتجات -->
        <div id="itemsTab" class="tab-content active">
            <h2>إضافة عنصر جديد (لعبة/مود/فيديو)</h2>
            <form id="itemForm" onsubmit="addItem(event)" style="margin-top:15px;">
                <div class="form-group"><label>العنوان</label><input type="text" id="itemTitle" required></div>
                <div class="form-group"><label>التصنيف</label>
                    <select id="itemCat">
                        <option value="minecraft">ماين كرافت</option>
                        <option value="roblox">روبلكس</option>
                        <option value="mods">مودات</option>
                        <option value="scripts">سكربتات</option>
                        <option value="other-games">ألعاب أخرى</option>
                        <option value="videos">فيديوهات</option>
                    </select>
                </div>
                <div class="form-group"><label>رابط الصورة</label><input type="url" id="itemImg" required></div>
                <div class="form-group"><label>رابط التنزيل / المشاهدة</label><input type="url" id="itemUrl" required></div>
                <div class="form-group"><label>الوصف الشامل</label><textarea id="itemDesc" rows="3"></textarea></div>
                <button type="submit" class="btn-submit">إضافة وحفظ المنتجات</button>
            </form>

            <div class="list-section">
                <h3>العناصر الحالية:</h3>
                <div id="itemsList"></div>
            </div>
        </div>

        <!-- تبويب الشراكات -->
        <div id="partnersTab" class="tab-content">
            <h2>إضافة شريك جديد لروم الشراكات</h2>
            <form id="partnerForm" onsubmit="addPartner(event)" style="margin-top:15px;">
                <div class="form-group"><label>اسم الشريك / القناة</label><input type="text" id="pName" placeholder="مثال: قناة Ali Gaming" required></div>
                <div class="form-group"><label>رابط صورة الشريك</label><input type="url" id="pImg" placeholder="رابط صورة الشريك الشخصية" required></div>
                <div class="form-group"><label>رابط قناة اليوتيوب</label><input type="url" id="pYt" placeholder="https://youtube.com/@..." required></div>
                <button type="submit" class="btn-submit">إضافة شريك جديد</button>
            </form>

            <div class="list-section">
                <h3>الشركاء الحاليين:</h3>
                <div id="partnersList"></div>
            </div>
        </div>
    </div>

    <script>
        const OWNER = "markbrabos010-lab";
        const REPO = "ALIOPZTE-";
        const PATH = "data.json";

        let currentData = { items: [], partners: [] };
        let fileSha = "";

        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem("ali_gh_token") || "";
            if(savedToken) document.getElementById("ghToken").value = savedToken;
            loadData();
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        async function loadData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?t=` + new Date().getTime());
                if(res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    const content = decodeURIComponent(escape(atob(data.content)));
                    const parsed = JSON.parse(content);
                    if(Array.isArray(parsed)) {
                        currentData = { items: parsed, partners: [] };
                    } else {
                        currentData = { items: parsed.items || [], partners: parsed.partners || [] };
                    }
                    renderLists();
                }
            } catch(e) { alert("خطأ في جلب البيانات من GitHub"); }
        }

        function renderLists() {
            const iList = document.getElementById("itemsList");
            iList.innerHTML = "";
            currentData.items.forEach((item, index) => {
                iList.innerHTML += `
                    <div class="list-item">
                        <span><strong>${item.title}</strong> (${item.category})</span>
                        <button class="btn-del" onclick="deleteItem(${index})">حذف</button>
                    </div>`;
            });

            const pList = document.getElementById("partnersList");
            pList.innerHTML = "";
            currentData.partners.forEach((partner, index) => {
                pList.innerHTML += `
                    <div class="list-item">
                        <span><strong>${partner.name}</strong></span>
                        <button class="btn-del" onclick="deletePartner(${index})">حذف الشريك</button>
                    </div>`;
            });
        }

        async function saveData() {
            const token = document.getElementById("ghToken").value.trim();
            if(!token) { alert("يرجى إدخال توكن GitHub أولاً!"); return; }
            localStorage.setItem("ali_gh_token", token);

            const jsonStr = JSON.stringify(currentData, null, 2);
            const encoded = btoa(unescape(encodeURIComponent(jsonStr)));

            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "تحديث البيانات والشراكات عبر لوحة التحكم",
                        content: encoded,
                        sha: fileSha
                    })
                });

                if(res.ok) {
                    alert("تم حفظ ونشر البيانات بنجاح في الموقع!");
                    loadData();
                } else {
                    alert("خطأ في الحفظ، تأكد من صحة التوكن والصلاحيات.");
                }
            } catch(e) { alert("تعذر الاتصال بالسيرفر!"); }
        }

        function addItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                title: document.getElementById("itemTitle").value,
                category: document.getElementById("itemCat").value,
                image: document.getElementById("itemImg").value,
                url: document.getElementById("itemUrl").value,
                desc: document.getElementById("itemDesc").value
            };
            currentData.items.unshift(newItem);
            saveData();
            document.getElementById("itemForm").reset();
        }

        function addPartner(e) {
            e.preventDefault();
            const newPartner = {
                id: Date.now(),
                name: document.getElementById("pName").value,
                image: document.getElementById("pImg").value,
                youtubeUrl: document.getElementById("pYt").value
            };
            currentData.partners.unshift(newPartner);
            saveData();
            document.getElementById("partnerForm").reset();
        }

        function deleteItem(index) {
            if(confirm("هل أنت تأكد من حذف هذا العنصر؟")) {
                currentData.items.splice(index, 1);
                saveData();
            }
        }

        function deletePartner(index) {
            if(confirm("هل أنت تأكد من حذف هذا الشريك؟")) {
                currentData.partners.splice(index, 1);
                saveData();
            }
        }
    </script>
</body>
</html>
