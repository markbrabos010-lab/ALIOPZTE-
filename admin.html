<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد ALIOPZTE | إدارة المتجر والترند</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #05070e;
            --card-bg: rgba(13, 18, 30, 0.95);
            --accent-cyan: #00f2fe;
            --accent-purple: #7f00ff;
            --accent-pink: #ff007f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { background: var(--bg-dark); color: #fff; font-family: 'Tajawal', sans-serif; padding: 20px; min-height: 100vh; }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 14, 0.98); backdrop-filter: blur(15px); z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .login-card {
            background: var(--card-bg); border: 2px solid var(--accent-cyan);
            border-radius: 20px; padding: 30px; max-width: 400px; width: 100%; text-align: center;
        }

        .admin-container {
            display: none; max-width: 950px; margin: 0 auto; background: var(--card-bg);
            border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 20px; padding: 24px;
        }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .header h1 { font-size: 1.4rem; color: var(--accent-cyan); }
        .btn-back { color: #fff; text-decoration: none; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 10px; font-weight: bold; }

        .form-group { margin-bottom: 16px; text-align: right; }
        label { display: block; margin-bottom: 6px; font-weight: 700; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(5,7,14,0.8); color: #fff; font-family: inherit; }

        .file-input-wrapper {
            position: relative; background: rgba(0, 242, 254, 0.1); border: 2px dashed var(--accent-cyan);
            border-radius: 12px; padding: 15px; text-align: center; cursor: pointer;
        }
        .file-input-wrapper input[type="file"] { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        .img-preview { max-width: 100px; max-height: 70px; border-radius: 8px; margin-top: 10px; display: none; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 130px; padding: 12px; border: none; border-radius: 10px; background: rgba(255,255,255,0.05); color: #888; font-family: inherit; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .btn-submit { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple)); color: #fff; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        .btn-cancel { background: #475569; display: none; }

        .list-section { margin-top: 30px; text-align: right; }
        .list-item { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 12px; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
        .btn-edit { background: #eab308; color: #000; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-del { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <i class="fa-solid fa-shield-halved" style="font-size: 2.8rem; color: var(--accent-cyan); margin-bottom: 15px;"></i>
            <h2>لوحة تحكم <span style="color:var(--accent-cyan)">ALIOPZTE</span></h2>
            <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:20px;">أدخل كلمة السر (19861986)</p>
            <form onsubmit="checkPassword(event)">
                <div class="form-group"><input type="password" id="passInput" placeholder="أدخل كلمة السر..." required style="text-align:center;"></div>
                <button type="submit" class="btn-submit">دخول الداشبورد</button>
            </form>
        </div>
    </div>

    <div id="adminContainer" class="admin-container">
        <div class="header">
            <h1><i class="fa-solid fa-gauge-high"></i> لوحة التحكم والترند</h1>
            <a href="index.html" class="btn-back"><i class="fa-solid fa-store"></i> العودة للمتجر</a>
        </div>

        <div class="form-group"><label><i class="fa-solid fa-key"></i> توكن GitHub</label><input type="password" id="ghToken" placeholder="الصق التوكن هنا..."></div>

        <!-- اختيار العنصر الأفضل/الرائج لعرضه في واجهة المتجر -->
        <div class="form-group" style="background: rgba(0,242,254,0.05); padding: 15px; border-radius: 12px; border: 1px solid var(--accent-cyan);">
            <label><i class="fa-solid fa-fire" style="color:#ff007f"></i> تحديد العنصر الرائج (الأفضل هذا الأسبوع في الواجهة)</label>
            <select id="featuredSelect" onchange="updateFeaturedItem()" style="font-weight:bold; color:#00f2fe;">
                <option value="">اختر العنصر الرائج...</option>
            </select>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('itemsTab', this)">الألعاب والمودات</button>
            <button class="tab-btn" onclick="switchTab('videosTab', this)">الفيديوهات</button>
            <button class="tab-btn" onclick="switchTab('partnersTab', this)">روم الشراكات</button>
        </div>

        <!-- تبويب الألعاب -->
        <div id="itemsTab" class="tab-content active">
            <h2 id="itemFormTitle">إضافة / تعديل عنصر</h2>
            <form id="itemForm" onsubmit="handleItemSave(event)">
                <div class="form-group"><label>العنوان</label><input type="text" id="itemTitle" required></div>
                <div class="form-group"><label>التصنيف</label>
                    <select id="itemCat">
                        <option value="minecraft">ماين كرافت</option>
                        <option value="roblox">روبلكس</option>
                        <option value="mods">مودات</option>
                        <option value="scripts">سكربتات</option>
                        <option value="other-games">ألعاب أخرى</option>
                    </select>
                </div>
                <div class="form-group"><label>صورة العنصر (من جهازك)</label>
                    <div class="file-input-wrapper"><p id="itemImgText">اختر صورة</p><input type="file" id="itemImgFile" accept="image/*" onchange="previewImage(this, 'itemPreview', 'itemImgText')"></div>
                    <img id="itemPreview" class="img-preview">
                </div>
                <div class="form-group"><label>رابط التحميل</label><input type="url" id="itemUrl" required></div>
                <div class="form-group"><label>الوصف</label><textarea id="itemDesc" rows="3"></textarea></div>
                <button type="submit" id="btnSaveItem" class="btn-submit">حفظ العنصر</button>
                <button type="button" id="btnCancelItem" class="btn-submit btn-cancel" onclick="resetItemForm()">إلغاء</button>
            </form>
            <div class="list-section"><h3>العناصر الحالية:</h3><div id="itemsList"></div></div>
        </div>

        <!-- تبويب الفيديوهات -->
        <div id="videosTab" class="tab-content">
            <h2 id="vidFormTitle">إضافة / تعديل فيديو</h2>
            <form id="videoForm" onsubmit="handleVideoSave(event)">
                <div class="form-group"><label>عنوان الفيديو</label><input type="text" id="vidTitle" required></div>
                <div class="form-group"><label>غلاف الفيديو (من جهازك)</label>
                    <div class="file-input-wrapper"><p id="vidImgText">اختر غلاف</p><input type="file" id="vidImgFile" accept="image/*" onchange="previewImage(this, 'vidPreview', 'vidImgText')"></div>
                    <img id="vidPreview" class="img-preview">
                </div>
                <div class="form-group"><label>رابط اليوتيوب</label><input type="url" id="vidUrl" required></div>
                <div class="form-group"><label>الوصف</label><textarea id="vidDesc" rows="3"></textarea></div>
                <button type="submit" id="btnSaveVid" class="btn-submit">حفظ الفيديو</button>
                <button type="button" id="btnCancelVid" class="btn-submit btn-cancel" onclick="resetVideoForm()">إلغاء</button>
            </form>
            <div class="list-section"><h3>الفيديوهات الحالية:</h3><div id="videosList"></div></div>
        </div>

        <!-- تبويب الشراكات -->
        <div id="partnersTab" class="tab-content">
            <h2 id="partnerFormTitle">إضافة شريك</h2>
            <form id="partnerForm" onsubmit="handlePartnerSave(event)">
                <div class="form-group"><label>اسم الشريك</label><input type="text" id="pName" required></div>
                <div class="form-group"><label>صورة الشريك (من جهازك)</label>
                    <div class="file-input-wrapper"><p id="pImgText">اختر صوره</p><input type="file" id="pImgFile" accept="image/*" onchange="previewImage(this, 'pPreview', 'pImgText')"></div>
                    <img id="pPreview" class="img-preview">
                </div>
                <div class="form-group"><label>رابط يوتيوب</label><input type="url" id="pYt" required></div>
                <button type="submit" id="btnSavePartner" class="btn-submit">حفظ الشريك</button>
                <button type="button" id="btnCancelPartner" class="btn-submit btn-cancel" onclick="resetPartnerForm()">إلغاء</button>
            </form>
            <div class="list-section"><h3>الشركاء:</h3><div id="partnersList"></div></div>
        </div>
    </div>

    <script>
        const DASHBOARD_PIN = "19861986";
        const OWNER = "markbrabos010-lab";
        const REPO = "ALIOPZTE-";
        const PATH = "data.json";

        let currentData = { items: [], partners: [], featuredId: null };
        let fileSha = "";
        let editingItemId = null, editingVideoId = null, editingPartnerId = null;
        let itemBase64 = "", vidBase64 = "", partnerBase64 = "";

        function checkPassword(e) {
            e.preventDefault();
            if (document.getElementById("passInput").value === DASHBOARD_PIN) {
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("adminContainer").style.display = "block";
                loadData();
            } else { alert("كلمة السر خطأ!"); }
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function previewImage(input, previewId, textId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById(previewId).src = e.target.result;
                    document.getElementById(previewId).style.display = "block";
                    document.getElementById(textId).innerText = "تم اختيار الصورة";
                    if (previewId === 'itemPreview') itemBase64 = e.target.result;
                    if (previewId === 'vidPreview') vidBase64 = e.target.result;
                    if (previewId === 'pPreview') partnerBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (res.ok) {
                    const parsed = await res.json();
                    currentData.items = parsed.items || [];
                    currentData.partners = parsed.partners || [];
                    currentData.featuredId = parsed.featuredId || null;
                    renderLists();
                    populateFeaturedDropdown();
                }
            } catch(e) {}
        }

        function populateFeaturedDropdown() {
            const select = document.getElementById("featuredSelect");
            select.innerHTML = '<option value="">اختر العنصر الرائج...</option>';
            currentData.items.forEach(item => {
                const selected = item.id == currentData.featuredId ? 'selected' : '';
                select.innerHTML += `<option value="${item.id}" ${selected}>${item.title} (${item.category})</option>`;
            });
        }

        async function updateFeaturedItem() {
            const val = document.getElementById("featuredSelect").value;
            currentData.featuredId = val ? parseInt(val) : null;
            await saveDataToGitHub();
        }

        function renderLists() {
            const iList = document.getElementById("itemsList"); iList.innerHTML = "";
            currentData.items.filter(i => i.category !== 'videos').forEach(item => {
                iList.innerHTML += `<div class="list-item"><span><b>${item.title}</b></span><div><button class="btn-edit" onclick="editItem(${item.id})">تعديل</button> <button class="btn-del" onclick="deleteItem(${item.id})">حذف</button></div></div>`;
            });

            const vList = document.getElementById("videosList"); vList.innerHTML = "";
            currentData.items.filter(i => i.category === 'videos').forEach(vid => {
                vList.innerHTML += `<div class="list-item"><span><b>${vid.title}</b></span><div><button class="btn-edit" onclick="editVideo(${vid.id})">تعديل</button> <button class="btn-del" onclick="deleteItem(${vid.id})">حذف</button></div></div>`;
            });

            const pList = document.getElementById("partnersList"); pList.innerHTML = "";
            currentData.partners.forEach(p => {
                pList.innerHTML += `<div class="list-item"><span><b>${p.name}</b></span><div><button class="btn-edit" onclick="editPartner(${p.id})">تعديل</button> <button class="btn-del" onclick="deletePartner(${p.id})">حذف</button></div></div>`;
            });
        }

        function handleItemSave(e) {
            e.preventDefault();
            if (editingItemId) {
                const item = currentData.items.find(i => i.id === editingItemId);
                if (item) {
                    item.title = document.getElementById("itemTitle").value;
                    item.category = document.getElementById("itemCat").value;
                    item.url = document.getElementById("itemUrl").value;
                    item.desc = document.getElementById("itemDesc").value;
                    if (itemBase64) item.image = itemBase64;
                }
            } else {
                currentData.items.unshift({
                    id: Date.now(),
                    title: document.getElementById("itemTitle").value,
                    category: document.getElementById("itemCat").value,
                    image: itemBase64 || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png',
                    url: document.getElementById("itemUrl").value,
                    desc: document.getElementById("itemDesc").value,
                    rating: 4.9, downloads: '1k'
                });
            }
            saveDataToGitHub();
            resetItemForm();
        }

        function handleVideoSave(e) {
            e.preventDefault();
            if (editingVideoId) {
                const vid = currentData.items.find(i => i.id === editingVideoId);
                if (vid) {
                    vid.title = document.getElementById("vidTitle").value;
                    vid.url = document.getElementById("vidUrl").value;
                    vid.desc = document.getElementById("vidDesc").value;
                    if (vidBase64) vid.image = vidBase64;
                }
            } else {
                currentData.items.unshift({
                    id: Date.now(),
                    title: document.getElementById("vidTitle").value,
                    category: "videos",
                    image: vidBase64 || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png',
                    url: document.getElementById("vidUrl").value,
                    desc: document.getElementById("vidDesc").value,
                    rating: 4.9, downloads: '1k'
                });
            }
            saveDataToGitHub();
            resetVideoForm();
        }

        function handlePartnerSave(e) {
            e.preventDefault();
            if (editingPartnerId) {
                const p = currentData.partners.find(x => x.id === editingPartnerId);
                if (p) {
                    p.name = document.getElementById("pName").value;
                    p.youtubeUrl = document.getElementById("pYt").value;
                    if (partnerBase64) p.image = partnerBase64;
                }
            } else {
                currentData.partners.unshift({
                    id: Date.now(),
                    name: document.getElementById("pName").value,
                    image: partnerBase64 || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png',
                    youtubeUrl: document.getElementById("pYt").value
                });
            }
            saveDataToGitHub();
            resetPartnerForm();
        }

        function deleteItem(id) {
            if (confirm("هل تريد الحذف؟")) {
                currentData.items = currentData.items.filter(i => i.id !== id);
                if (currentData.featuredId === id) currentData.featuredId = null;
                saveDataToGitHub();
            }
        }

        function deletePartner(id) {
            if (confirm("هل تريد حذف الشريك؟")) {
                currentData.partners = currentData.partners.filter(p => p.id !== id);
                saveDataToGitHub();
            }
        }

        function editItem(id) {
            const item = currentData.items.find(i => i.id === id);
            if (!item) return;
            editingItemId = id;
            document.getElementById("itemTitle").value = item.title;
            document.getElementById("itemCat").value = item.category;
            document.getElementById("itemUrl").value = item.url;
            document.getElementById("itemDesc").value = item.desc || "";
            document.getElementById("itemPreview").src = item.image;
            document.getElementById("itemPreview").style.display = "block";
            itemBase64 = item.image;
            document.getElementById("btnSaveItem").innerText = "تحديث التعديلات";
            document.getElementById("btnCancelItem").style.display = "block";
        }

        function resetItemForm() {
            editingItemId = null; itemBase64 = "";
            document.getElementById("itemForm").reset();
            document.getElementById("itemPreview").style.display = "none";
            document.getElementById("btnSaveItem").innerText = "حفظ العنصر";
            document.getElementById("btnCancelItem").style.display = "none";
        }

        function editVideo(id) {
            const vid = currentData.items.find(i => i.id === id);
            if (!vid) return;
            editingVideoId = id;
            document.getElementById("vidTitle").value = vid.title;
            document.getElementById("vidUrl").value = vid.url;
            document.getElementById("vidDesc").value = vid.desc || "";
            document.getElementById("vidPreview").src = vid.image;
            document.getElementById("vidPreview").style.display = "block";
            vidBase64 = vid.image;
            document.getElementById("btnSaveVid").innerText = "تحديث الفيديو";
            document.getElementById("btnCancelVid").style.display = "block";
        }

        function resetVideoForm() {
            editingVideoId = null; vidBase64 = "";
            document.getElementById("videoForm").reset();
            document.getElementById("vidPreview").style.display = "none";
            document.getElementById("btnSaveVid").innerText = "حفظ الفيديو";
            document.getElementById("btnCancelVid").style.display = "none";
        }

        function editPartner(id) {
            const p = currentData.partners.find(x => x.id === id);
            if (!p) return;
            editingPartnerId = id;
            document.getElementById("pName").value = p.name;
            document.getElementById("pYt").value = p.youtubeUrl;
            document.getElementById("pPreview").src = p.image;
            document.getElementById("pPreview").style.display = "block";
            partnerBase64 = p.image;
            document.getElementById("btnSavePartner").innerText = "تحديث الشريك";
            document.getElementById("btnCancelPartner").style.display = "block";
        }

        function resetPartnerForm() {
            editingPartnerId = null; partnerBase64 = "";
            document.getElementById("partnerForm").reset();
            document.getElementById("pPreview").style.display = "none";
            document.getElementById("btnSavePartner").innerText = "حفظ الشريك";
            document.getElementById("btnCancelPartner").style.display = "none";
        }

        async function saveDataToGitHub() {
            const token = document.getElementById("ghToken").value.trim();
            if (!token) { alert("أدخل توكن GitHub أولاً!"); return; }
            localStorage.setItem("ali_gh_token", token);

            try {
                const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    fileSha = getData.sha;
                }

                const jsonStr = JSON.stringify(currentData, null, 2);
                const encoded = btoa(unescape(encodeURIComponent(jsonStr)));

                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "تحديث المتجر والترند", content: encoded, sha: fileSha })
                });

                if (res.ok) {
                    alert("تم الحفظ والنشر بنجاح!");
                    loadData();
                } else { alert("خطأ في الحفظ، تأكد من صحة التوكن."); }
            } catch (e) { alert("تعذر الاتصال بالسيرفر!"); }
        }
    </script>
</body>
</html>
