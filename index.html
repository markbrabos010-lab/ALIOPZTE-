<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIOPZTE Store | عالم الألعاب والمودات</title>
    <!-- خط تجوال من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* الثيمات والألوان المتغيرة */
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(15, 23, 42, 0.8);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7f00ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 242, 254, 0.2);
        }

        body.theme-cyber {
            --bg-dark: #0f051d;
            --card-bg: rgba(28, 10, 48, 0.85);
            --accent-cyan: #ff007f;
            --accent-blue: #7f00ff;
            --accent-purple: #00f2fe;
            --border-glow: rgba(255, 0, 127, 0.3);
        }

        body.theme-emerald {
            --bg-dark: #022c22;
            --card-bg: rgba(6, 78, 59, 0.75);
            --accent-cyan: #10b981;
            --accent-blue: #34d399;
            --accent-purple: #059669;
            --border-glow: rgba(16, 185, 129, 0.3);
        }

        body.theme-purple {
            --bg-dark: #1e1b4b;
            --card-bg: rgba(49, 46, 129, 0.8);
            --accent-cyan: #c084fc;
            --accent-blue: #818cf8;
            --accent-purple: #e879f9;
            --border-glow: rgba(192, 132, 252, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, var(--border-glow) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.4s ease;
        }

        /* الهيدر العلوي */
        .main-header {
            background: rgba(7, 10, 18, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 20px;
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon {
            font-size: 1.8rem;
            color: var(--accent-cyan);
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .brand-text {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
        }

        .brand-text span {
            color: var(--accent-cyan);
        }

        /* صندوق البحث */
        .search-box {
            position: relative;
            flex: 1;
            max-width: 380px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 42px 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--border-glow);
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* محول الألوان والثيمات */
        .theme-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .theme-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease;
        }

        .theme-dot:hover {
            transform: scale(1.2);
        }

        .theme-dot.neon { background: #00f2fe; }
        .theme-dot.cyber { background: #ff007f; }
        .theme-dot.emerald { background: #10b981; }
        .theme-dot.purple { background: #c084fc; }

        /* أزرار التواصل والتنقل */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-social {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
        }

        .btn-social.youtube {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: #ff4d4d;
        }

        .btn-social.youtube:hover {
            background: #ff0000;
            color: #fff;
        }

        .btn-social.discord {
            background: rgba(88, 101, 242, 0.2);
            border: 1px solid rgba(88, 101, 242, 0.4);
            color: #7289da;
        }

        .btn-social.discord:hover {
            background: #5865F2;
            color: #fff;
        }

        .btn-admin {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #fff;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* شريط التصنيفات */
        .categories-bar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .cat-btn:hover {
            color: #fff;
            border-color: var(--accent-cyan);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            border-color: transparent;
            font-weight: 900;
            box-shadow: 0 0 18px var(--border-glow);
        }

        /* الكروت */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.35s ease;
        }

        .item-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--border-glow);
        }

        .card-thumb {
            width: 100%;
            height: 185px;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .item-card:hover .card-thumb img {
            transform: scale(1.08);
        }

        .badge-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #fff;
            background: rgba(7, 10, 18, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-details {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-card-view {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        /* نافذة الوصف التفصيلية المنبثقة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #0f172a;
            border: 1px solid var(--accent-cyan);
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 24px;
            box-shadow: 0 0 40px var(--border-glow);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: #fff;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
            background: rgba(0, 0, 0, 0.3);
            padding: 14px;
            border-radius: 10px;
            border-right: 3px solid var(--accent-cyan);
        }

        .modal-dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.1rem;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .header-container { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
        }
    </style>
</head>
<body class="theme-neon">

    <!-- الهيدر العلوي -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="brand">
                <i class="fa-solid fa-gamepad brand-icon"></i>
                <div class="brand-text">ALIOPZTE <span>STORE</span></div>
            </a>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" oninput="filterItems()" placeholder="ابحث عن ألعاب، مودات، سكربتات...">
            </div>

            <!-- أزرار تبديل الألوان والثيمات -->
            <div class="theme-switcher" title="اختر الثيم المفضل">
                <div class="theme-dot neon" onclick="setTheme('theme-neon')"></div>
                <div class="theme-dot cyber" onclick="setTheme('theme-cyber')"></div>
                <div class="theme-dot emerald" onclick="setTheme('theme-emerald')"></div>
                <div class="theme-dot purple" onclick="setTheme('theme-purple')"></div>
            </div>

            <div class="header-actions">
                <a href="https://youtube.com/@aliopzte790?si=mW1nU7yXKT5EjYGI" target="_blank" class="btn-social youtube">
                    <i class="fa-brands fa-youtube"></i> القناة
                </a>
                <a href="https://discord.gg/7BNpX9uZa" target="_blank" class="btn-social discord">
                    <i class="fa-brands fa-discord"></i> الديسكورد
                </a>
                <a href="admin.html" class="btn-admin">
                    <i class="fa-solid fa-gauge-high"></i> الداشبورد
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- شريط التصنيفات -->
        <nav class="categories-bar">
            <button class="cat-btn active" onclick="selectCategory('all', this)"><i class="fa-solid fa-border-all"></i> الكل</button>
            <button class="cat-btn" onclick="selectCategory('minecraft', this)"><i class="fa-solid fa-cube"></i> ماين كرافت</button>
            <button class="cat-btn" onclick="selectCategory('roblox', this)"><i class="fa-solid fa-gamepad"></i> روبلكس</button>
            <button class="cat-btn" onclick="selectCategory('mods', this)"><i class="fa-solid fa-puzzle-piece"></i> مودات</button>
            <button class="cat-btn" onclick="selectCategory('scripts', this)"><i class="fa-solid fa-code"></i> سكربتات</button>
            <button class="cat-btn" onclick="selectCategory('other-games', this)"><i class="fa-solid fa-ghost"></i> ألعاب أخرى</button>
            <button class="cat-btn" onclick="selectCategory('videos', this)"><i class="fa-solid fa-play"></i> فيديوهات</button>
        </nav>

        <!-- قسم المحتوى -->
        <section class="content-section">
            <div id="itemsGrid" class="items-grid">
                <p style="text-align:center; width:100%; grid-column: 1/-1; padding:40px; color: var(--text-muted);">جاري تحميل المحتوى من السيرفر...</p>
            </div>
        </section>
    </div>

    <!-- النافذة المنبثقة للوصف والتفاصيل Modal -->
    <div id="itemModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModalDirect()"><i class="fa-solid fa-xmark"></i></button>
            <img id="mImg" src="" alt="" class="modal-img">
            <h2 id="mTitle" class="modal-title"></h2>
            <div id="mMeta" style="display:flex; gap:15px; color:var(--accent-cyan); font-weight:bold; font-size:0.85rem; margin-bottom:15px;"></div>
            <p id="mDesc" class="modal-desc"></p>
            <a id="mDlBtn" href="" target="_blank" class="modal-dl-btn"><i class="fa-solid fa-download"></i> تنزيل / مشاهدة الآن</a>
        </div>
    </div>

    <script>
        let allItems = [];
        let currentCategory = 'all';

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('aliopzte_theme') || 'theme-neon';
            document.body.className = savedTheme;
            loadStoreData();
        });

        function setTheme(themeName) {
            document.body.className = themeName;
            localStorage.setItem('aliopzte_theme', themeName);
        }

        async function loadStoreData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error("تعذر جلب ملف البيانات");
                
                const data = await res.json();
                allItems = Array.isArray(data) ? data : (data.items || []);
                renderItems(allItems);
            } catch (err) {
                console.error("خطأ في تحميل البيانات:", err);
                document.getElementById('itemsGrid').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#ef4444; padding:30px;">تعذر تحميل المنتجات، يرجى المحاولة لاحقاً.</p>';
            }
        }

        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            const filtered = items.filter(item => {
                const matchesCat = (currentCategory === 'all') || (item.category === currentCategory);
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const matchesSearch = !query || 
                    (item.title && item.title.toLowerCase().includes(query)) ||
                    (item.desc && item.desc.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; padding: 40px; color: var(--text-muted);">لا تتوفر عناصر في هذا القسم حالياً.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => openModal(item);

                card.innerHTML = `
                    <div class="card-thumb">
                        <img src="${item.image || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png'}" alt="${item.title}">
                        <span class="badge-tag">${getCategoryLabel(item.category)}</span>
                    </div>
                    <div class="card-details">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc || 'اضغط لمشاهدة التفاصيل والوصف...'}</p>
                        <div class="card-meta">
                            <span><i class="fa-solid fa-code-branch" style="color:var(--accent-cyan);"></i> ${item.version || 'v1.0'}</span>
                            <span><i class="fa-solid fa-star" style="color:#f59e0b;"></i> ${item.rating || '4.9'}</span>
                            <span><i class="fa-solid fa-download"></i> ${item.downloads || '1k'}</span>
                        </div>
                        <button class="btn-card-view">
                            <i class="fa-solid fa-eye"></i> عرض التفاصيل والتحميل
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(item) {
            document.getElementById('mImg').src = item.image || 'https://raw.githubusercontent.com/github/explore/80688e429a7d4ef2fca1e82350fe8e3517d3494d/topics/github/github.png';
            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('mDesc').innerText = item.desc && item.desc.trim() !== '' ? item.desc : 'لا يوجد وصف إضافي لهذا العنصر.';
            document.getElementById('mDlBtn').href = item.url;
            document.getElementById('mMeta').innerHTML = `
                <span><i class="fa-solid fa-tag"></i> ${getCategoryLabel(item.category)}</span>
                <span><i class="fa-solid fa-code-branch"></i> ${item.version || 'v1.0'}</span>
                <span><i class="fa-solid fa-user"></i> ${item.developer || 'ALIOPZTE'}</span>
            `;
            document.getElementById('itemModal').classList.add('active');
        }

        function closeModal(e) {
            if (e.target.id === 'itemModal') {
                document.getElementById('itemModal').classList.remove('active');
            }
        }

        function closeModalDirect() {
            document.getElementById('itemModal').classList.remove('active');
        }

        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderItems(allItems);
        }

        function filterItems() {
            renderItems(allItems);
        }

        function getCategoryLabel(cat) {
            const labels = {
                'minecraft': 'ماين كرافت',
                'roblox': 'روبلكس',
                'mods': 'مودات',
                'scripts': 'سكربتات',
                'other-games': 'ألعاب أخرى',
                'videos': 'فيديو'
            };
            return labels[cat] || cat;
        }
    </script>
</body>
</html>
